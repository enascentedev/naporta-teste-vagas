services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naporta_test
      POSTGRES_PASSWORD: naporta_test
      POSTGRES_DB: naporta_test
    ports:
      - '${POSTGRES_TEST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naporta_test -d naporta_test']
      interval: 2s
      timeout: 5s
      retries: 15
