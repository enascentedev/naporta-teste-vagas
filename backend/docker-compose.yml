services:
  postgres:
    image: postgres:16-alpine
    container_name: naporta-postgres
    environment:
      POSTGRES_USER: naporta
      POSTGRES_PASSWORD: naporta
      POSTGRES_DB: naporta
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naporta -d naporta']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: naporta-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://naporta:naporta@postgres:5432/naporta?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'

volumes:
  postgres_data:
