include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Conflita com o padrão de injeção usado no projeto: parâmetros nomeados
    # públicos atribuídos a campos privados (ex.: `required AppDatabase
    # database` -> `_database`), que initializing formals não suportam.
    prefer_initializing_formals: false

analyzer:
  exclude:
    - lib/**/*.g.dart
